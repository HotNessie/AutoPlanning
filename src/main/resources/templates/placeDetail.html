<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장소 상세 정보 - Autoplan</title>
  <link rel="stylesheet" href="/css/placeDetail.css">
</head>

<body>
  <header class="top-nav">
    <div class="nav-left">
      <a href="/home" class="logo-link">
        <div class="icon-home">
          <svg class="logo-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

              d="M1.067,15.411l2.075,1.477c1.062,.755,2.317,1.14,3.572,1.14,.893,0,1.787-.195,2.612-.59l12.953-5.698c1.486-.71,2.133-2.504,1.441-4-.694-1.497-2.475-2.152-3.976-1.465l-3.143,1.402L9.982,3.591c-.882-.656-2.05-.774-3.052-.311l-.781,.366c-.611,.287-1.033,.857-1.129,1.525-.096,.669,.148,1.335,.654,1.783l4.204,3.72-3.591,1.602-3.057-1.122c-.984-.359-2.084-.041-2.735,.791-.392,.501-.556,1.132-.462,1.776,.099,.677,.475,1.292,1.033,1.688ZM7,5.457l.776-.364c.332-.154,.721-.113,1.085,.151l5.531,3.418-2.506,1.118L7,5.457ZM2.071,13.179c.098-.125,.224-.169,.334-.169,.05,0,3.574,1.285,3.574,1.285,.245,.09,.515,.081,.752-.025l13.833-6.171,.013-.006c.501-.231,1.096-.012,1.328,.487,.234,.507,.016,1.114-.46,1.342l-12.953,5.698c-1.357,.647-2.964,.51-4.191-.362l-2.075-1.476c-.114-.081-.193-.211-.213-.348-.015-.102,.005-.188,.058-.256Zm21.929,9.821c0,.553-.448,1-1,1H1c-.552,0-1-.447-1-1s.448-1,1-1H23c.552,0,1,.447,1,1Z" />
          </svg>
        </div>
      </a>
      <h1 class="page-title">장소 상세</h1>
    </div>
    <div class="nav-right">
      <a href="/placeMain" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z" />
        </svg>
        <span>탐색으로 돌아가기</span>
      </a>
    </div>
  </header>

  <main class="main-wrapper">
    <section class="search-section">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
          viewBox="0 0 16 16">
          <path
            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
        </svg>
        <input type="text" id="placeDetail-search-input" placeholder="새로운 장소 검색...">
        <button id="searchButton" style="display:none;"></button> <!-- 이벤트 트리거용 숨김 버튼 -->
      </div>
      <!-- 자동완성 목록 컨테이너 -->
      <div id="suggestion" class="suggestion-container" style="display: none;">
        <ul id="results" class="results-list"></ul>
      </div>
    </section>

    <article id="place-detail-root">
      <div class="loader-container">
        <div class="spinner"></div>
        <p>장소 정보를 불러오는 중입니다...</p>
      </div>
    </article>
  </main>

  <script type="module" src="/js/page/placeDetail/placeDetail.js"></script>
</body>

</html>
